name: uberVU
description: uberVU was a social media analytics and monitoring company, backed by
  Seedcamp, that offered brand-insight dashboards and a metrics API before being
  acquired by Hootsuite in 2014. The company no longer operates independently -
  ubervu.com now 301-redirects to blog.hootsuite.com/social-media-analytics/, its
  former metrics API is retired, and its GitHub organization is dormant. This
  profile is kept as a historical record of a VC-portfolio company with no current
  public API surface.
